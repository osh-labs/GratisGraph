name: Desktop

# GratisGraph Desktop (desktop/). Core: lint, strict types, tests on Linux and
# Windows without Qt. GUI: offscreen PySide6 tests on Linux.

on:
  push:
    branches: [main]
    paths: ['desktop/**', '*.py', 'pyproject.toml', 'tests/golden/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '*.py', 'pyproject.toml', 'tests/golden/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install driver and core
        run: python -m pip install -e . -e "desktop[dev]"
      - name: Lint
        working-directory: desktop
        run: python -m ruff check src tests
      - name: Types (core)
        working-directory: desktop
        run: python -m mypy src/ggdesk
      - name: Library
        working-directory: desktop
        run: python -m ggdesk.cli library validate
      - name: Test (core)
        working-directory: desktop
        run: python -m pytest -q -m "not gui" tests/unit

  gui:
    name: GUI (offscreen) / ubuntu
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Qt runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install -e . -e "desktop[dev]"
          python -m pip install -e "desktop[gui]" pytest-qt
      - name: Types (core + app)
        working-directory: desktop
        run: python -m mypy
      - name: Test (GUI)
        working-directory: desktop
        run: python -m pytest -q tests/gui
      - name: Self-test
        working-directory: desktop
        run: python -m ggdesk_app.app --self-test
