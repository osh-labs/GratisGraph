<polyline class="cut" data-kind="cut" points="45,55 55,55 55,45 45,45 45,55"/>
<circle class="start" data-kind="start" cx="45" cy="55" r="0.8"/>
<text class="label" x="50" y="104" text-anchor="middle">operator</text>
</svg>
