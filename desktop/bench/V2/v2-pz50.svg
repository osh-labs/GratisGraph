<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="-6 -6 112 112">
<!-- GratisGraph Desktop preview from decoded .m20 bytes. Machine frame, mm: home (0,0) back-left, +X right, +Y toward the operator (drawn down). -->
<style>
.field {fill:none;stroke:#6b7280;stroke-width:0.3;stroke-dasharray:2 1}
.part {fill:#e5e7eb;stroke:#374151;stroke-width:0.25}
.keep-out {fill:#fca5a5;fill-opacity:0.5;stroke:#b91c1c;stroke-width:0.25}
.rapid {fill:none;stroke:#2563eb;stroke-width:0.15;stroke-dasharray:1 0.6}
.cut {fill:none;stroke:#111827;stroke-width:0.3;stroke-linejoin:round;stroke-linecap:round}
.start {fill:#16a34a;stroke:none}
.label {fill:#374151;font-family:sans-serif;font-size:3px}
</style>
<polyline class="field" data-kind="field" points="0,0 100,0 100,100 0,100 0,0"/>
<polyline class="part" data-kind="part" points="30,70 70,70 70,30 30,30 30,70"/>
<polyline class="rapid" data-kind="rapid" points="0,0 45,55"/>
